name: SauceDemo Test Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Verify browser installation
        shell: bash
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            google-chrome --version || chrome --version
          else
            firefox --version
          fi

      - name: Run test suite
        run: mvn --batch-mode --no-transfer-progress clean test -Dheadless=true -Dbrowser=${{ matrix.browser }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/cucumber-reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14